<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Царевны большого города</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Marck+Script&family=Montserrat:wght@400;500&display=swap">
<style>
:root{--bg:#f7f2ea;--card:#fffaf3;--ink:#2b2236;--muted:#6f6480;--p:#7b5ea7;--pd:#5d4488;--pink:#e9b8d0;--soft:#efe4f5;--line:#e3d6ea;--on:#fff;--hbg:rgba(247,242,234,.92);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1726;--card:#2a2136;--ink:#f3ebf8;--muted:#b9acc9;--p:#b79be0;--pd:#9a7cc9;--pink:#8a4f78;--soft:#33284a;--line:#3c3050;--on:#1d1726;--hbg:rgba(29,23,38,.92)}}
:root[data-theme="dark"]{--bg:#1d1726;--card:#2a2136;--ink:#f3ebf8;--muted:#b9acc9;--p:#b79be0;--pd:#9a7cc9;--pink:#8a4f78;--soft:#33284a;--line:#3c3050;--on:#1d1726;--hbg:rgba(29,23,38,.92)}
*,*::before,*::after{box-sizing:border-box}
html{height:auto;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.65 'Montserrat',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hbg);z-index:30}
img{max-width:100%;display:block}a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px}
.logo{font:400 24px 'Marck Script',cursive;text-decoration:none;white-space:nowrap}
nav{display:flex;gap:6px;align-items:center;overflow-x:auto}
nav a{text-decoration:none;font-size:13px;padding:8px 12px;border-radius:999px;color:var(--muted);white-space:nowrap}
nav a.on,nav a:hover{background:var(--soft);color:var(--ink)}
.cartbtn{border:0;background:var(--p);color:var(--on);border-radius:999px;padding:8px 14px;font:500 13px 'Montserrat';cursor:pointer;white-space:nowrap}
.btn{display:inline-block;border:0;cursor:pointer;text-decoration:none;text-align:center;background:var(--p);color:var(--on);padding:12px 24px;border-radius:999px;font:500 14px 'Montserrat';transition:.2s}
.btn:hover{background:var(--pd);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--p);box-shadow:inset 0 0 0 1.5px var(--p)}
.btn.ghost:hover{background:var(--soft)}
#app{animation:f .4s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}}
h1,h2,h3{margin:0}
h1{font:400 clamp(42px,8vw,76px)/1.05 'Marck Script',cursive}
h2{font:600 clamp(28px,5vw,40px) 'Cormorant Garamond',serif;text-align:center;margin:64px 0 8px}
.sub{text-align:center;color:var(--muted);margin:0 auto 28px;max-width:520px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center;padding:40px 0}
.hero .txt{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.eyebrow{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--p)}
.hero p{color:var(--muted);margin:0;max-width:440px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.himg{border-radius:200px 200px 28px 28px;overflow:hidden;box-shadow:0 20px 50px -20px var(--p);aspect-ratio:4/5}
.himg img{width:100%;height:100%;object-fit:cover}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
.feat div{background:var(--soft);border-radius:20px;padding:22px}
.feat b{font:600 22px 'Cormorant Garamond',serif;display:block;margin-bottom:4px}
.feat span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -22px var(--p)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer}
.cb{padding:16px 18px 20px;display:flex;flex-direction:column;gap:4px;flex:1}
.tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--p)}
.card h3{font:400 27px/1.2 'Marck Script',cursive}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.row{display:flex;gap:8px;margin-top:12px}.row .btn{flex:1;padding:11px 10px;font-size:13px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:8px 18px;font:500 13px 'Montserrat';cursor:pointer}
.chip.on{background:var(--p);border-color:var(--p);color:var(--on)}
.banner{margin-top:56px;border-radius:28px;padding:40px 28px;text-align:center;background:linear-gradient(135deg,var(--pink),#b9a2e0);color:#2b2236}
.banner h3{font:400 clamp(30px,6vw,46px)/1.15 'Marck Script',cursive;margin-bottom:8px}
.banner p{margin:0 auto 20px;max-width:480px}.banner .btn{background:#2b2236;color:#fff}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;counter-reset:s}
.steps div{counter-increment:s;padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
.steps div::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--p);color:var(--on);font-weight:500;margin-bottom:10px}
.steps b{display:block;margin-bottom:2px}.steps span{color:var(--muted);font-size:14px}
.prod{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding:34px 0;align-items:start}
.prod img{border-radius:26px;width:100%}
.prod h1{font-size:clamp(38px,6vw,56px);margin:6px 0 10px}
.prod ul{padding-left:18px;color:var(--muted)}
.back{display:inline-block;margin-top:24px;color:var(--muted);text-decoration:none;font-size:13px}
.page{max-width:680px;margin:0 auto;padding:36px 0}
.page p{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{font:400 15px 'Montserrat';padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
footer{margin-top:72px;border-top:1px solid var(--line);padding:34px 0 40px;text-align:center;color:var(--muted);font-size:13px}
footer nav{justify-content:center;margin-bottom:10px}
#shade{position:fixed;inset:0;background:rgba(20,10,30,.45);z-index:40;display:none}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);z-index:50;transform:translateX(100%);transition:.3s;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px))}
body.open #drawer{transform:none}body.open #shade{display:block}
#items{flex:1;overflow:auto;margin:14px 0}
.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it img{width:56px;height:56px;border-radius:12px;object-fit:cover}.it div{flex:1;font-size:14px;line-height:1.3}
.q{display:flex;gap:6px;align-items:center}.q button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--ink);cursor:pointer}
@media(max-width:760px){.hero,.prod{grid-template-columns:1fr}.hero{padding-top:20px}.himg{max-width:380px;margin:0 auto}.bar{height:56px}.logo{font-size:20px}nav.main{display:none}}
</style>
</head>

home:function(){return '<section class="hero"><div class="txt"><span class="eyebrow">Asanova · уход и подарки</span><h1>Царевны большого города</h1><p>Нежный уход для тела и наборы, которые хочется дарить. Тихая роскошь в каждой баночке.</p><div class="btns"><a class="btn" href="#catalog">Смотреть каталог</a><a class="btn ghost" href="#about">О нас</a></div></div><div class="himg"><img src="'+P[0].img+'" alt="Скраб Тайна царицы"></div></section>'
 +'<div class="feat"><div><b>Нежный уход</b><span>Скрабы и средства для тела с красивым ароматом.</span></div><div><b>Готовые подарки</b><span>Наборы в аккуратной упаковке, уже собраны.</span></div><div><b>Быстрый заказ</b><span>Одна кнопка, и мы на связи в Telegram.</span></div></div>'
 +'<h2>Наши товары</h2><p class="sub">Выберите свой любимый, мы подскажем всё по цене и наличию.</p><div class="grid">'+P.map(card).join('')+'</div>'
 +'<div class="banner"><h3>Подарок, который запомнится</h3><p>Собрали набор «Тайна царицы»: скраб, полотенце, лавандовая соль и ароматные фигурки.</p><a class="btn" href="#set">Смотреть набор</a></div>'
 +'<h2>Как заказать</h2><p class="sub">Три простых шага.</p><div class="steps"><div><b>Выберите товар</b><span>Откройте каталог и найдите то, что нравится.</span></div><div><b>Нажмите «Заказать»</b><span>Откроется Telegram с готовым сообщением.</span></div><div><b>Отправьте нам</b><span>Мы ответим, уточним детали и договоримся о получении.</span></div></div>'},
catalog:function(f){f=f||'all';var l=P.filter(function(p){return f=='all'||p.cat==f});
 return '<h2 style="margin-top:44px">Каталог</h2><p class="sub">Всё, что есть у Царевен.</p><div class="chips">'+[['all','Все'],['care','Уход'],['gift','Подарки']].map(function(c){return '<button class="chip'+(c[0]==f?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>'}).join('')+'</div><div class="grid">'+l.map(card).join('')+'</div>'},
about:function(){return '<div class="page"><h2 style="margin-top:20px">О нас</h2><p style="text-align:center">«Царевны большого города» — это про заботу о себе без суеты. Мы собираем средства и подарочные наборы, в которых приятно всё: от аромата и текстуры до упаковки.</p><p style="text-align:center">Нам важно, чтобы каждая баночка и каждая коробка дарили маленький праздник. Берите себе или дарите тем, кого любите.</p><div class="feat"><div><b>Эстетика</b><span>Нежные фиолетовые и розовые оттенки во всём.</span></div><div><b>Забота</b><span>Уход, который приятно делать.</span></div></div><p style="text-align:center;margin-top:28px"><a class="btn" href="#catalog">В каталог</a></p></div>'},
contacts:function(){return '<div class="page"><h2 style="margin-top:20px">Контакты</h2><p style="text-align:center">Напишите нам в Telegram, ответим на вопросы и поможем с заказом. Или заполните форму ниже, и сообщение сформируется само.</p><div style="margin:22px 0"><div class="field">Ваше имя<input id="fn" placeholder="Как к вам обращаться"></div><div class="field">Что интересует<select id="fp">'+P.map(function(p){return '<option>'+p.name+' ('+p.type+')</option>'}).join('')+'<option>Другое</option></select></div><div class="field">Комментарий<textarea id="fc" rows="3" placeholder="Пожелания, вопросы"></textarea></div><a class="btn" id="fs" style="display:block" target="_blank" rel="noopener" href="#">Отправить в Telegram</a></div><p style="text-align:center"><a class="btn ghost" target="_blank" rel="noopener" href="'+TG+'">Открыть Telegram</a></p></div>'},
product:function(p){return '<div class="prod"><img src="'+p.img+'" alt="'+p.name+'"><div><span class="tag">'+p.type+'</span><h1>'+p.name+'</h1><p style="color:var(--muted)">'+p.long+'</p><ul>'+p.list.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><div class="row" style="max-width:380px"><button class="btn ghost" data-add="'+p.id+'">В корзину</button><a class="btn" target="_blank" rel="noopener" href="'+one(p)+'">Заказать</a></div><a class="back" href="#catalog">← Назад в каталог</a></div></div>'}
};
function route(){var h=location.hash.slice(1)||'home',p=P.filter(function(x){return x.id==h})[0],k=p?'catalog':h;
 app.innerHTML=p?V.product(p):(V[h]?V[h]():V.home());
 document.querySelectorAll('nav.main a').forEach(function(a){a.classList.toggle('on',a.dataset.n==k)});
 if(h=='contacts')form();window.scrollTo(0,0)}
function form(){var s=document.getElementById('fs');function u(){s.href=tg('Здравствуйте! Меня зовут '+(fn.value||'…')+'. Интересует: '+fp.value+'.'+(fc.value?' '+fc.value:''))}
 ['fn','fp','fc'].forEach(function(i){document.getElementById(i).addEventListener('input',u)});u()}
function draw(){var ids=Object.keys(cart),n=0,t=[];
 document.getElementById('items').innerHTML=ids.length?ids.map(function(i){var p=P.filter(function(x){return x.id==i})[0];n+=cart[i];t.push('— '+p.ask+' × '+cart[i]);
  return '<div class="it"><img src="'+p.img+'" alt=""><div>'+p.name+'<br><small style="color:var(--muted)">'+p.type+'</small></div><div class="q" style="flex:none"><button data-m="'+i+'">−</button>'+cart[i]+'<button data-a="'+i+'">+</button></div></div>'}).join(''):'<p style="color:var(--muted)">Пока пусто. Добавьте что-нибудь из каталога 💜</p>';
 document.getElementById('cnt').textContent=n;
 document.getElementById('send').href=ids.length?tg('Здравствуйте! Хочу заказать:\n'+t.join('\n')+'\nПодскажите, пожалуйста, цену и как оформить заказ 💜'):'#catalog'}
document.addEventListener('click',function(e){var t=e.target.closest('[data-add],[data-a],[data-m],[data-f],[data-go]');
 if(e.target.id=='cartbtn'||e.target.closest('#cartbtn')){document.body.classList.add('open');return}
 if(e.target.id=='close'||e.target.id=='shade'){document.body.classList.remove('open');return}
 if(e.target.closest('#send')&&!Object.keys(cart).length){document.body.classList.remove('open');return}
 if(!t)return;var d=t.dataset;
 if(d.go){location.hash=d.go}
 if(d.f){app.innerHTML=V.catalog(d.f)}
 if(d.add||d.a){var i=d.add||d.a;cart[i]=(cart[i]||0)+1;draw();if(d.add)document.body.classList.add('open')}
 if(d.m){cart[d.m]--;if(cart[d.m]<1)delete cart[d.m];draw()}});
window.addEventListener('hashchange',route);route();draw();
</script>
</body>
</html>
